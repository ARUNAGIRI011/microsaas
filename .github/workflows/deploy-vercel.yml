name: Vercel Staging and Production Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-delivery-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run lint

      - name: Production build
        run: bun run build

  deploy-staging:
    name: Deploy and smoke-test staging
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Vercel credentials are configured
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview deployment
        run: vercel build --target=preview --token="$VERCEL_TOKEN"

      - name: Deploy staging preview
        id: deploy
        shell: bash
        run: |
          DEPLOY_LOG="$(vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$DEPLOY_LOG"
          URL="$(printf '%s\n' "$DEPLOY_LOG" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          if [[ -z "$URL" ]]; then
            echo "::error::Vercel did not return a vercel.app deployment URL."
            exit 1
          fi
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staging deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test staging API
        env:
          STAGING_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$STAGING_URL/api/health"

  deploy-production:
    name: Approve, deploy and promote production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Vercel credentials are configured
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Create production candidate without assigning domains
        id: deploy
        shell: bash
        run: |
          DEPLOY_LOG="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$DEPLOY_LOG"
          URL="$(printf '%s\n' "$DEPLOY_LOG" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          if [[ -z "$URL" ]]; then
            echo "::error::Vercel did not return a vercel.app deployment URL."
            exit 1
          fi
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production candidate: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test production candidate before promotion
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$CANDIDATE_URL/api/health"

      - name: Promote candidate to production domains
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: vercel promote "$CANDIDATE_URL" --token="$VERCEL_TOKEN"

      - name: Record release summary
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## BizMate AI production release"
            echo "- Production deployment: $CANDIDATE_URL"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
