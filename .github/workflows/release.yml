name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Package frontend build
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -d dist
          tar -czf "bizmate-ai-frontend-${RELEASE_TAG}.tar.gz" -C dist .
          cd dist && zip -qr "../bizmate-ai-frontend-${RELEASE_TAG}.zip" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TARBALL="bizmate-ai-frontend-${RELEASE_TAG}.tar.gz"
          ZIPFILE="bizmate-ai-frontend-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" "$ZIPFILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" "$ZIPFILE" \
              --title "BizMate AI $RELEASE_TAG" \
              --generate-notes --verify-tag
          fi
