name: Validate BizMate AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/supabase-foundation"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and refresh lockfile in CI
        run: bun install

      - name: Type-check
        run: bun run lint

      - name: Build
        run: bun run build
